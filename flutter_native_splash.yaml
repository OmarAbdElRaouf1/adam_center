flutter_native_splash:
  color: "#000000" ##====================================[REQUIRED]==========

  image: assets/images/splash.png

  fullscreen: true # default false


  # Android 12+ only allows a centered icon (no full-screen image): the
  # round emblem on black, sized to sit inside the system's icon circle.
  android_12:
    color: "#000000"
    image: assets/images/splash_android12.png
